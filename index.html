<!DOCTYPE html>
<html>
<head>
  <title>Roguelite: Dark Adventures</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/main.js" type="module" defer></script>
</head>
<body>

<div id="startMenuCtn">
    <h1 class="menu-title">Roguelite: Dark Adventures</h1>
    <div class="menu-buttons">
        <button id="newGameBtn" onclick="newGame()">New Game</button>
        <button id="continueGameBtn" onclick="continueGame()">Continue (WIP)</button>
    </div>
</div>

<div id="gameCtn" class="hidden">
  <h1 id="gameTitle">Roguelite: Dark Adventures</h1>
  
  <div id="gameLayout">
    <div id="leftColumn">
      <div id="imageContainer">
        <img id="storyImage" alt="Story Image" hidden />
      </div>
      <div id="characterStatsCtn">
        <h3>Character Stats</h3>
        <div class="statGrid" id="statsGrid"></div>
      </div>
      <div id="classAbilitiesCtn">
        <h3>Class Abilities</h3>
        <div class="abilityList" id="abilityList"></div>
      </div>
      <div id="textToImageCtn">
        <input id="textToImageInput" placeholder="Describe an image to generate..." />
        <button onclick="generateImageFromText()">Generate Image</button>
      </div>
      <div id="imageToTextCtn">
        <input id="imageToTextInput" type="file" accept="image/*" />
        <button onclick="generateTextFromImage()">Generate Text from Image</button>
      </div>
    </div>
    
    <div id="middleColumn">
      <div id="loadingIndicator" hidden>⏳ Summoning dark forces...</div>
      <div id="storyCtn" class="preserve-whitespace"></div>
      <div id="choicesCtn"></div>
      <div id="customChoiceSection">
        <h3>Forge Your Own Path</h3>
        <input id="customChoiceInput" placeholder="Describe your own action or response..." />
        <button id="submitCustomChoiceBtn" onclick="makeCustomChoice()">Submit Custom Choice</button>
      </div>
      <div id="dialogueCtn" hidden>
        <div id="dialogueHeader">
          <img id="npcPortrait" src="https://placehold.co/80x80?text=NPC" alt="NPC Portrait">
          <div id="npcInfo">
            <h3 id="npcName">Unknown NPC</h3>
            <div id="npcAttitude">Attitude: <span class="relationshipIndicator neutral">Neutral</span></div>
          </div>
        </div>
        <div id="dialogueContent">...</div>
        <div id="dialogueChoices"></div>
      </div>
      <div id="combatCtn" hidden>
        <h3 id="combatTitle">Combat</h3>
        <div id="combatLayout">
          <div id="playerCombatCtn">
            <h4 class="combatantName">You</h4>
            <img id="playerCombatImg" class="combatantImg" src="https://placehold.co/120x120?text=Player" alt="Player">
            <div class="healthBar">
              <div id="playerHealthFill" class="healthBarFill"></div>
              <div id="playerHealthText" class="healthBarText">100/100</div>
            </div>
            <div id="playerStatus" class="combatStatus"></div>
          </div>
          <div id="enemyCombatCtn">
            <h4 id="enemyName" class="combatantName">Enemy</h4>
            <img id="enemyCombatImg" class="combatantImg" src="https://placehold.co/120x120?text=Enemy" alt="Enemy">
            <div class="healthBar">
              <div id="enemyHealthFill" class="healthBarFill"></div>
              <div id="enemyHealthText" class="healthBarText">100/100</div>
            </div>
            <div id="enemyStatus" class="combatStatus"></div>
          </div>
        </div>
        <div id="combatActions">
          <button id="attackBtn" class="combatBtn" onclick="performCombatAction('attack')">Attack</button>
          <button id="defendBtn" class="combatBtn" onclick="performCombatAction('defend')">Defend</button>
          <button id="specialBtn" class="combatBtn" onclick="performCombatAction('special')">Special</button>
          <button id="itemBtn" class="combatBtn" onclick="performCombatAction('item')">Use Item</button>
        </div>
        <div id="combatLog">
          <div class="combatMessage system">Combat has begun! Choose your action...</div>
        </div>
      </div>
      <div id="questJournalElement" class="repgElement">
        <h3>Quest Journal</h3>
        <div id="questEntries"></div>
      </div>
      <div id="ttsControlsCtn">
        <button id="toggleTtsBtn" onclick="toggleTTS()">
          <span class="ttsIcon">🔈</span>
          <span id="ttsButtonText">Enable Narrator</span>
        </button>
      </div>
      <div id="diceSection">
        <div id="diceDescription">Select dice type and roll...</div>
        <div id="diceTypeSelection">
          <button class="dice-btn" data-dice="d4">d4</button>
          <button class="dice-btn" data-dice="d6">d6</button>
          <button class="dice-btn" data-dice="d8
